name: Unpack Nest and Yard source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unpack-source.yml"
      - "bootstrap/source.part*"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and unpack application source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part* > /tmp/nest-yard-source.b64
          base64 --decode /tmp/nest-yard-source.b64 > /tmp/nest-yard-source.tar.gz
          tar -xzf /tmp/nest-yard-source.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/unpack-source.yml

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean Nest & Yard bootstrap files"
          git push origin main

# Cleanup trigger after the complete application source is present.
